name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: enludus-daily/daily-actions/.github/workflows/ios-ci.yml@9e9139f6074871d755e073a7f54c6c6d085c2c87 # daily-actions 2026-11-05-io-enumerate
    with:
      actions-sha: 9e9139f6074871d755e073a7f54c6c6d085c2c87
      scheme: SpreadDiary
      # iPhone Duo の全画面の表示には Xcode 27.1（iOS 27.1 SDK）が要る（Apple Tech Talk「Prepare your app for iPhone Duo」）。
      # xcode-27 ランナーは GitHub で Preview 扱い（actions/runner-images #14404）。
      runs-on: xcode-27
      xcode-version: "27.1"
      test-destination: "platform=iOS Simulator,name=iPhone Duo,OS=27.1"
      screenshot-device: iPhone Duo
      # 撮る画面（ContentView の ScreenshotScene。@dark でダークモード）
      screenshot-posture: open
      screenshot-scenes: onboarding home learn drill scramble result decks deck record settings share compose home@dark drill@dark
      guard-disabled: ${{ vars.DAILY_GUARD_DISABLED == 'true' && 'true' || 'false' }}
